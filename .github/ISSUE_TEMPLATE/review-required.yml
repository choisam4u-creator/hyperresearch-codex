name: Review-required report
description: Report a reproducible quality warning without sharing private research data
title: "[Review required] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        GitHub issues are public. Do not paste the prompt, fetched text, raw logs, local paths, credentials, account details, or private URLs. Use a synthetic or mock reproduction whenever possible.
  - type: dropdown
    id: issue_kind
    attributes:
      label: Recorded issue kind
      options:
        - citation_unsupported
        - numeric_evidence_unclear
        - numeric_context_unclear
        - remaining_evidence_gaps
        - other
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Allowlisted feedback JSON
      description: Paste reviewed output from `hpr feedback RUN_ID`. Remove anything unexpected.
      render: json
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic or mock reproduction
      description: Provide the smallest reproduction without real prompts or fetched source text.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python, hpr and Codex CLI versions only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public submission check
      options:
        - label: I removed prompts, fetched text, raw logs, local paths, credentials and account details.
          required: true
