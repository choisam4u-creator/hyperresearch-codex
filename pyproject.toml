[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperresearch-codex"
version = "0.3.1"
description = "Codex-only deep research pipeline: Python orchestrates, codex exec judges, gates verify."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "samchoi"}]
dependencies = ["httpx>=0.27", "pypdf>=4.0"]
keywords = ["codex", "research", "agents", "deep-research", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/choisam4u-creator/hyperresearch-codex"
Repository = "https://github.com/choisam4u-creator/hyperresearch-codex"
Issues = "https://github.com/choisam4u-creator/hyperresearch-codex/issues"
Changelog = "https://github.com/choisam4u-creator/hyperresearch-codex/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7.4"]

[project.scripts]
hpr = "hprc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hprc"]
